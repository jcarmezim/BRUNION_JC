<section id="title-slide" class="custom-title">
  <div class="title-wrap">
    <div class="title-main">
      <h1 class="title">$title$</h1>
      $if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$
      <p class="presenters">$presenters$</p>
      <p class="contact">$contact$</p>
      <p class="date">$date$</p>
    </div>
    <div class="title-footer">
      <img src="$logo-left$" alt="Institution logo">
      <img src="$logo-right$" alt="University logo">
    </div>
  </div>
</section>
